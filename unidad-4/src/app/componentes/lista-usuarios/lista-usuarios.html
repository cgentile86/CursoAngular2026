<div class="encabezado">
        <h2>Usuarios</h2>
</div>
<div class="contenedor-tabla">
  <table class="tabla-usuarios">
    <thead>
      <tr>
        <th>ID</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th class="texto-derecha">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (usuario of listaUsuarios; track usuario.id) {
        <tr>
          <td>{{ usuario.id }}</td>
          <td><strong>{{ usuario.email }}</strong></td>
          <td>{{ usuario.rol }}</td>
          <td>{{ usuario.estado }}</td>
          <td class="texto-derecha">
            <div class="acciones">
              <button class="btn btn-editar" [routerLink]="['/usuarios', usuario.id]">
                Ver
              </button>
              <button class="btn btn-eliminar" (click)="eliminarUsuario(usuario.id)">
                Eliminar
              </button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="tabla-vacia">
            No hay usuarios registrados.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
