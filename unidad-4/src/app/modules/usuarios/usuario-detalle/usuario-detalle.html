@if(usuario){
    <div>
        <h3 class="titulo-usuario">Usuario: {{usuario.email}}</h3>
        <div class="detalles-usuario">
            <p><strong>Id:</strong> {{usuario.id}}</p>
            <p><strong>Rol:</strong> {{usuario.rol}}</p>
            <p><strong>Estado:</strong> {{usuario.estado}}</p>
        </div>
        <button class="btn btn-principal" (click)='volver()'>Volver a usuarios</button>
    </div>
    
}
@else {
    <div>
        <h3>Error de navegación:</h3>
        <p>{{errorMsg}}</p>
        <button class="btn btn-principal" (click)='volver()'>Volver a usuarios</button>
    </div>
}
